name: build book

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the book from the committed notebook outputs. Fast; catches broken
  # references, missing figures and malformed markdown.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the book
        run: jupyter-book build contents/ --warningiserror --nitpick
      - uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: contents/_build/html

  # Re-executes every notebook from scratch. This is what keeps the committed
  # outputs honest: if a notebook stops running, the build fails here.
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nbconvert
      - name: Execute all notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1200 \
            contents/*/*.ipynb
      - name: Report notebooks whose outputs changed
        run: |
          if ! git diff --quiet -- '*.ipynb'; then
            echo "::warning::Re-execution changed notebook outputs:"
            git diff --stat -- '*.ipynb'
          else
            echo "Committed outputs match a fresh execution."
          fi
