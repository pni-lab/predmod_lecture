# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: A Gentle Introduction to Predictive Modelling
author: Tamas Spisak
logo: logo.png
copyright: "2022-2026"

# Notebook outputs are committed to the repository, so the book itself builds without
# re-running anything. The notebooks are executed separately in continuous integration
# (.github/workflows/book.yml), which is what keeps the committed outputs honest.
execute:
  execute_notebooks: 'off'

only_build_toc_files: true

sphinx:
  config:
    bibtex_reference_style: label
    # notebooks are executed in CI, not here; fail the build on genuinely broken references
    nitpicky: false
    html_show_copyright: true

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
    - linkify
    - substitution

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: predmod_lecture.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/pni-lab/predmod_lecture  # Online location of your book
  path_to_book: contents  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  google_analytics_id: G-QPT1100TCY

# Launch button settings
launch_buttons:
  notebook_interface: "classic" # "jupyterlab"
  binderhub_url: "https://mybinder.org"  # The URL for your BinderHub (e.g., https://mybinder.org)
  colab_url: "https://colab.research.google.com"
  thebe: true
